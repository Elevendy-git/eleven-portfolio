name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static website
        run: python3 tools/build/build_pages.py --base-path /eleven-portfolio/ --output-dir _site
      - name: Verify website and interactions
        run: |
          python3 tests/site_integrity_test.py
          python3 tests/site_integrity_test.py --site-dir _site --base-path /eleven-portfolio/
          node tests/language-navigation.test.cjs
          node tests/card-interaction.test.cjs
          node tests/dialog-controller.test.cjs
          node tests/hero-interactions.test.cjs
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
